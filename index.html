<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustWork · Fair Pay, Proven Work, Protected Funds</title>

  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    @media print {
      body {
        background-color: #ffffff;
      }

      aside,
      header,
      footer,
      #toast-container,
      button {
        display: none !important;
      }

      main {
        max-width: 100% !important;
        padding: 0 !important;
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-amber-100 selection:text-amber-900">

  <!-- Main Root App Target -->
  <div id="app" class="flex-1 flex flex-col">
    <!-- Populated dynamically by app.js -->
    <div class="flex items-center justify-center min-h-[60vh]">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-3 border-amber-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-medium text-slate-600">Initializing TrustWork Platform...</p>
      </div>
    </div>
  </div>

  <!-- Storage Sanitation & Immediate Bootloader -->
  <script>
    try {
      const raw = localStorage.getItem('trustwork_state');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.trustAccount || !parsed.companies || !parsed.projects || !parsed.currentUser) {
          localStorage.removeItem('trustwork_state');
        }
      }
    } catch (e) {
      localStorage.removeItem('trustwork_state');
    }
  </script>

  <!-- Application Logic -->
  <script src="app.js?v=1.0.7"></script>
</body>

</html>
